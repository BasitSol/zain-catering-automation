<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zain Catering Services — Admin Portal</title>
  <meta name="description"
    content="Business management dashboard for Zain Catering Services. View orders, invoices, clients, and payments.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <!-- ═══════════════ SIDEBAR ═══════════════ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">ZC</div>
      <div class="brand-text">
        <h1>Zain Catering</h1>
        <span>Admin Portal</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" data-page="dashboard" id="nav-dashboard">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1" />
          <rect x="14" y="3" width="7" height="7" rx="1" />
          <rect x="3" y="14" width="7" height="7" rx="1" />
          <rect x="14" y="14" width="7" height="7" rx="1" />
        </svg>
        <span>Dashboard</span>
      </a>
      <a href="#" class="nav-item" data-page="orders" id="nav-orders">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
          <polyline points="14 2 14 8 20 8" />
          <line x1="16" y1="13" x2="8" y2="13" />
          <line x1="16" y1="17" x2="8" y2="17" />
        </svg>
        <span>Orders</span>
      </a>
      <a href="#" class="nav-item" data-page="clients" id="nav-clients">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M23 21v-2a4 4 0 00-3-3.87" />
          <path d="M16 3.13a4 4 0 010 7.75" />
        </svg>
        <span>Clients</span>
      </a>
      <a href="#" class="nav-item" data-page="invoices" id="nav-invoices">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="1" y="4" width="22" height="16" rx="2" ry="2" />
          <line x1="1" y1="10" x2="23" y2="10" />
        </svg>
        <span>Invoices</span>
      </a>
      <a href="#" class="nav-item" data-page="payments" id="nav-payments">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="1" x2="12" y2="23" />
          <path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6" />
        </svg>
        <span>Payments</span>
      </a>

    </nav>

    <div class="sidebar-footer">
      <div class="quick-actions">
        <p class="quick-actions-label">Quick Actions</p>
        <button class="action-btn" id="btn-client-order">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
          📋 Copy Client Order Link
        </button>
        <button class="action-btn action-btn-outline" id="btn-internal-order">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Internal Order Form
        </button>
        <button class="action-btn action-btn-outline" id="btn-confirm-order">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
          Confirm Order Form
        </button>
        <button class="action-btn action-btn-outline" id="btn-log-payment">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
          Log Payment Form
        </button>
      </div>
    </div>
  </aside>

  <!-- ═══════════════ MAIN CONTENT ═══════════════ -->
  <main class="main-content" id="main-content">
    <header class="top-bar">
      <button class="menu-toggle" id="menu-toggle" aria-label="Toggle sidebar">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>
      <h2 class="page-title" id="page-title">Dashboard</h2>
      <div class="top-bar-right">
        <button class="refresh-btn" id="refresh-btn" title="Refresh data">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10" />
            <path d="M20.49 15a9 9 0 11-2.12-9.36L23 10" />
          </svg>
        </button>
        <div class="user-badge">
          <div class="user-avatar">Z</div>
          <span>Zain Admin</span>
        </div>
      </div>
    </header>

    <div class="content-area" id="content-area">
      <!-- Dynamic content injected here by app.js -->
      <div class="loading-spinner" id="loading-spinner">
        <div class="spinner"></div>
        <p>Loading data...</p>
      </div>
    </div>
  </main>

  <!-- ═══════════════ TYPEFORM WIZARD MODAL ═══════════════ -->
  <div class="wizard-overlay" id="wizard-overlay" style="display: none;">
    <div class="wizard-container">
      <button class="wizard-close" id="wizard-close" title="Close Form">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>

      <!-- Progress bar -->
      <div class="wizard-progress-bar">
        <div class="wizard-progress-fill" id="wizard-progress-fill" style="width: 0%;"></div>
      </div>

      <!-- Form header -->
      <div class="wizard-header">
        <h3 id="wizard-title">Client Order Form</h3>
        <p id="wizard-desc">Step-by-step event details collection</p>
      </div>

      <!-- Main container of active step question -->
      <div class="wizard-step-area" id="wizard-step-area">
        <!-- Injected dynamically by app.js -->
      </div>

      <!-- Navigation buttons -->
      <div class="wizard-nav-bar">
        <span class="wizard-step-count" id="wizard-step-count">Step 1 of 5</span>
        <div class="wizard-nav-btns">
          <button class="wizard-btn wizard-btn-outline" id="wizard-prev-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            Back
          </button>
          <button class="wizard-btn" id="wizard-next-btn">
            <span id="wizard-next-btn-text">Next</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
