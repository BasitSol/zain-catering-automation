<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zain Catering Services — Admin Portal</title>
  <meta name="description"
    content="Business management dashboard for Zain Catering Services. View orders, invoices, clients, and payments.">
  <meta name="theme-color" content="#b5391a">
  <meta name="color-scheme" content="light dark">

  <!-- Brand mark as favicon: no extra asset, no extra request -->
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b5391a'/%3E%3Ctext x='16' y='21.5' font-family='Inter,Segoe UI,sans-serif' font-size='14' font-weight='800' fill='%23fff' text-anchor='middle'%3EZC%3C/text%3E%3C/svg%3E">

  <script>
    /* Apply the stored theme before first paint so there is no flash of the
       wrong palette. Wrapped defensively — private windows can throw on read. */
    (function () {
      try {
        var saved = localStorage.getItem('zc-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <!-- ═══════════════ SIDEBAR ═══════════════ -->
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="sidebar-brand">
      <div class="brand-icon" aria-hidden="true">ZC</div>
      <div class="brand-text">
        <h1>Zain Catering</h1>
        <span>Admin Portal</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" data-page="dashboard" id="nav-dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="9" rx="1.5" />
          <rect x="14" y="3" width="7" height="5" rx="1.5" />
          <rect x="14" y="12" width="7" height="9" rx="1.5" />
          <rect x="3" y="16" width="7" height="5" rx="1.5" />
        </svg>
        <span>Dashboard</span>
      </a>
      <a href="#" class="nav-item" data-page="orders" id="nav-orders">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
          <polyline points="14 2 14 8 20 8" />
          <line x1="16" y1="13" x2="8" y2="13" />
          <line x1="16" y1="17" x2="8" y2="17" />
        </svg>
        <span>Orders</span>
      </a>
      <a href="#" class="nav-item" data-page="clients" id="nav-clients">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M23 21v-2a4 4 0 00-3-3.87" />
          <path d="M16 3.13a4 4 0 010 7.75" />
        </svg>
        <span>Clients</span>
      </a>
      <a href="#" class="nav-item" data-page="invoices" id="nav-invoices">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="M4 3h16v18l-2.7-1.8L14.6 21 12 19.2 9.4 21l-2.7-1.8L4 21z" />
          <line x1="8.5" y1="8.5" x2="15.5" y2="8.5" />
          <line x1="8.5" y1="12.5" x2="13" y2="12.5" />
        </svg>
        <span>Invoices</span>
      </a>
      <a href="#" class="nav-item" data-page="payments" id="nav-payments">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <line x1="12" y1="1" x2="12" y2="23" />
          <path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6" />
        </svg>
        <span>Payments</span>
      </a>
      <a href="#" class="nav-item" data-page="logs" id="nav-logs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="M12 9v4" />
          <path d="M12 17h.01" />
          <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
        </svg>
        <span>System Logs</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="quick-actions">
        <p class="quick-actions-label">Quick Actions</p>
        <button class="action-btn" id="btn-client-order" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71" />
            <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71" />
          </svg>
          Copy Client Order Link
        </button>
        <button class="action-btn action-btn-outline" id="btn-internal-order" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
            <polyline points="14 2 14 8 20 8" />
            <line x1="12" y1="18" x2="12" y2="12" />
            <line x1="9" y1="15" x2="15" y2="15" />
          </svg>
          Internal Order Form
        </button>
        <button class="action-btn action-btn-outline" id="btn-confirm-order" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <polyline points="20 6 9 17 4 12" />
          </svg>
          Confirm Order Form
        </button>
        <button class="action-btn action-btn-outline" id="btn-log-payment" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="1" x2="12" y2="23" />
            <path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6" />
          </svg>
          Log Payment Form
        </button>
      </div>
    </div>
  </aside>

  <!-- Dimmer behind the mobile drawer. Must stay a sibling *after* .sidebar -->
  <div class="sidebar-scrim" id="sidebar-scrim" aria-hidden="true"></div>

  <!-- ═══════════════ MAIN CONTENT ═══════════════ -->
  <main class="main-content" id="main-content">
    <header class="top-bar">
      <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Toggle navigation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          aria-hidden="true">
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>

      <h2 class="page-title" id="page-title">Dashboard</h2>

      <div class="top-bar-right">
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch colour theme" title="Switch theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
          </svg>
        </button>

        <button class="refresh-btn" id="refresh-btn" type="button" title="Refresh data" aria-label="Refresh data">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <polyline points="23 4 23 10 17 10" />
            <path d="M20.49 15a9 9 0 11-2.12-9.36L23 10" />
          </svg>
        </button>

        <div class="user-badge">
          <div class="user-avatar" aria-hidden="true">Z</div>
          <span>Zain Admin</span>
        </div>
      </div>
    </header>

    <div class="content-area" id="content-area">
      <!-- Dynamic content injected here by app.js -->
      <div class="loading-spinner" id="loading-spinner">
        <div class="spinner"></div>
        <p>Loading data...</p>
      </div>
    </div>
  </main>

  <!-- ═══════════════ WIZARD MODAL ═══════════════ -->
  <div class="wizard-overlay" id="wizard-overlay" style="display: none;" role="dialog" aria-modal="true"
    aria-labelledby="wizard-title">
    <div class="wizard-container">
      <button class="wizard-close" id="wizard-close" type="button" title="Close form" aria-label="Close form">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>

      <!-- Progress bar -->
      <div class="wizard-progress-bar">
        <div class="wizard-progress-fill" id="wizard-progress-fill" style="width: 0%;"></div>
      </div>

      <!-- Form header -->
      <div class="wizard-header">
        <h3 id="wizard-title">Client Order Form</h3>
        <p id="wizard-desc">Step-by-step event details collection</p>
      </div>

      <!-- Main container of active step question -->
      <div class="wizard-step-area" id="wizard-step-area">
        <!-- Injected dynamically by app.js -->
      </div>

      <!-- Navigation buttons -->
      <div class="wizard-nav-bar">
        <span class="wizard-step-count" id="wizard-step-count">Step 1 of 5</span>
        <div class="wizard-nav-btns">
          <button class="wizard-btn wizard-btn-outline" id="wizard-prev-btn" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="15 18 9 12 15 6" />
            </svg>
            Back
          </button>
          <button class="wizard-btn" id="wizard-next-btn" type="button">
            <span id="wizard-next-btn-text">Next</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>

  <script>
    /* ── Presentation-only enhancements ───────────────────────────────────────
       Self-contained: nothing here touches app.js state, data, or endpoints. */
    (function () {
      // Theme toggle
      var toggle = document.getElementById('theme-toggle');
      if (toggle) {
        toggle.addEventListener('click', function () {
          var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          try { localStorage.setItem('zc-theme', next); } catch (e) { /* storage unavailable */ }
        });
      }

      // Tapping the scrim closes the mobile drawer
      var scrim = document.getElementById('sidebar-scrim');
      var sidebarEl = document.getElementById('sidebar');
      if (scrim && sidebarEl) {
        scrim.addEventListener('click', function () { sidebarEl.classList.remove('open'); });
      }

      // Keep aria-current in step with the .active class app.js manages
      var navItems = document.querySelectorAll('.nav-item');
      function syncAria() {
        navItems.forEach(function (item) {
          if (item.classList.contains('active')) item.setAttribute('aria-current', 'page');
          else item.removeAttribute('aria-current');
        });
      }
      navItems.forEach(function (item) {
        item.addEventListener('click', function () { setTimeout(syncAria, 0); });
      });
      syncAria();

      // Esc closes the wizard, matching the close button
      document.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape') return;
        var overlayEl = document.getElementById('wizard-overlay');
        if (overlayEl && overlayEl.style.display !== 'none') {
          document.getElementById('wizard-close').click();
        }
      });
    })();
  </script>
</body>

</html>
